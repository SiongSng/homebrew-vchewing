name: Update vchewing cask

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync cask with latest vChewing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM="vChewing/vChewing-macOS"
          CASK="Casks/vchewing.rb"

          latest=$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')
          echo "Latest upstream release: ${latest}"

          current=$(grep -E '^  version "' "${CASK}" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Current cask version: ${current}"

          if [ "${latest}" = "${current}" ]; then
            echo "Already up to date."
            exit 0
          fi

          asset="vChewing-macOS-${latest}-signed.pkg"
          echo "Downloading ${asset}"
          gh release download "${latest}" \
            --repo "${UPSTREAM}" \
            --pattern "${asset}" \
            --output "${asset}"
          sha=$(shasum -a 256 "${asset}" | awk '{print $1}')
          rm -f "${asset}"
          echo "New sha256: ${sha}"

          python3 - <<PY
          path = "${CASK}"
          latest, sha = "${latest}", "${sha}"
          with open(path) as f:
              lines = f.readlines()
          out = []
          for line in lines:
              if line.strip().startswith("version "):
                  out.append(f'  version "{latest}"\n')
              elif line.strip().startswith("sha256 "):
                  out.append(f'  sha256 "{sha}"\n')
              else:
                  out.append(line)
          with open(path, "w") as f:
              f.writelines(out)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CASK}"
          git commit -m "chore: bump vchewing to ${latest}"
          git push
          echo "Pushed update to ${latest}."
